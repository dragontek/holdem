<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="feltBg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Felt Emblem Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#feltBg)" stroke="url(#goldTrim)" stroke-width="3" />

  <!-- Subtle Poker Chip Dashed Inner Ring -->
  <rect
    x="6.5"
    y="6.5"
    width="51"
    height="51"
    rx="10.5"
    stroke="#fbbf24"
    stroke-opacity="0.28"
    stroke-width="1.25"
    stroke-dasharray="4 3"
  />

  <!-- Left Card: Jack of Spades -->
  <g transform="rotate(-12 24 34)" filter="url(#cardShadow)">
    <rect x="10" y="13" width="26" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text
      x="14.5"
      y="27"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="14"
      font-weight="900"
      fill="#0f172a"
    >J</text>
    <!-- Small Spade Pip -->
    <path
      d="M22 33.5 C22 33.5 17 38 17 40.8 C17 42.5 18.4 43.7 19.9 43.7 C20.8 43.7 21.5 43.2 21.8 42.6 L21.1 45.2 H22.9 L22.2 42.6 C22.5 43.2 23.2 43.7 24.1 43.7 C25.6 43.7 27 42.5 27 40.8 C27 38 22 33.5 22 33.5 Z"
      fill="#0f172a"
    />
  </g>

  <!-- Right Card: 10 of Hearts / Gold Accent -->
  <g transform="rotate(10 40 34)" filter="url(#cardShadow)">
    <rect x="27" y="14" width="27" height="37" rx="4" fill="#ffffff" stroke="#fbbf24" stroke-width="1.4" />
    <text
      x="30"
      y="28.5"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="13.5"
      font-weight="900"
      letter-spacing="-0.8"
      fill="#0f172a"
    >10</text>
    <!-- Bold Gold-Accented Spade Pip -->
    <path
      d="M41.5 34 C41.5 34 35.5 39.2 35.5 42.3 C35.5 44.2 37.1 45.6 38.9 45.6 C40 45.6 40.8 45.1 41.2 44.3 L40.3 47.4 H42.7 L41.8 44.3 C42.2 45.1 43 45.6 44.1 45.6 C45.9 45.6 47.5 44.2 47.5 42.3 C47.5 39.2 41.5 34 41.5 34 Z"
      fill="#d97706"
    />
  </g>
</svg>
