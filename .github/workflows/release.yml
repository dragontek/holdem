name: Release & Deploy PROD — Semantic Release + Appwrite Sites (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-and-deploy-main
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Semantic Release (v1.x.x)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout main (full history for semver calculation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify Lint, Production Build & Site Tarball
        env:
          VITE_BASE_PATH: /
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://dragontek.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '6ad3e9f6000495b2033d' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'holdem_db' }}
          VITE_APPWRITE_VENUE_BUCKET_ID: ${{ vars.VITE_APPWRITE_VENUE_BUCKET_ID || 'venue_images' }}
        run: |
          npm run lint
          npm run bundle:site

      - name: Upload Production Bundle for Appwrite Deploy
        uses: actions/upload-artifact@v4
        with:
          name: prod-holdem-site-${{ github.sha }}
          path: holdem-site.tar.gz
          retention-days: 7

      - name: Install semantic-release toolchain
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/changelog@6 \
            @semantic-release/npm@12 \
            @semantic-release/git@10 \
            @semantic-release/github@11 \
            conventional-changelog-conventionalcommits@8

      - name: Run Semantic Release (Tag v1.x.x + Changelog + GitHub Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Sync Release Metadata Back to develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main develop
          if git show-ref --verify --quiet refs/remotes/origin/develop; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B develop origin/develop
            if git merge --no-edit -X theirs origin/main; then
              git push origin develop || echo "Notice: Could not auto-sync develop (branch protection may require manual PR)."
            else
              echo "Notice: Skipping automatic back-merge to develop due to merge conflict."
              git merge --abort || true
            fi
          fi

  deploy-appwrite:
    name: Auto-Deploy Production to Appwrite Sites
    needs: release
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (for node-appwrite SDK)
        run: npm ci

      - name: Download Verified Production Site Tarball
        uses: actions/download-artifact@v4
        with:
          name: prod-holdem-site-${{ github.sha }}
          path: .

      - name: Deploy & Activate on Appwrite Sites
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ vars.APPWRITE_SITE_ID || secrets.APPWRITE_SITE_ID }}
          APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://dragontek.io/v1' }}
          APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '6ad3e9f6000495b2033d' }}
        run: node scripts/deployAppwriteSite.mjs
